  IdentityServer-style authorization server carrying 35 scopes) and fhir.troymedicare.com
  (a Troy-branded OAuth 2.0 authorization surface fronting the health plan's FHIR data
  access). Both were saved verbatim. Hosts that answer 200 with an HTML single-page-app
  shell for every /.well-known/ path (broker.troymedicare.com) are recorded as
  present-but-not-a-real-document and were NOT saved.
