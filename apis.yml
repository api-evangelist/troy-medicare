apis:
- aid: troy-medicare-provider-portal-identity
  name: Troy Medicare Provider Portal Identity Service
  description: >-
    The OpenID Connect authorization server behind Troy Medicare's secure provider portal, which
    contracted providers use for member eligibility verification, claim status and payment history.
    Its discovery document is served anonymously and advertises 35 scopes, 37 claims, PKCE, the
    device authorization grant, token introspection and revocation, and front- and back-channel
    logout. Scope naming identifies the underlying platform as NirvanaHealth Aria, which Troy
    Medicare announced it selected in July 2023, but the issuer and every endpoint are hosted on
    Troy Medicare's own domain. No client registration path is published, so this is not a
    developer-consumable API today.
  humanURL: https://troymedicare.com/providers
  baseURL: https://provider.troymedicare.com
  tags:
  - Identity
  - OpenID Connect
  - Authentication
  - Provider Portal
  tags_raw:
  - Identity
  - OpenID Connect
  - OAuth
  - Provider Portal
  properties:
  - type: Authentication
    url: authentication/troy-medicare-authentication.yml
  - type: OAuthScopes
    url: scopes/troy-medicare-scopes.yml
  - type: OpenIDConnect
    url: https://provider.troymedicare.com/.well-known/openid-configuration
- aid: troy-medicare-fhir
  name: Troy Medicare FHIR Authorization Surface
  description: >-
    A Troy-Medicare-branded OAuth 2.0 authorization surface at fhir.troymedicare.com, serving an
    OpenID Connect discovery document and a JWKS anonymously, with a member username/password sign-in
    page at the host root. It is the front door to the health plan's FHIR data access. The FHIR
    resource base itself is not anonymously discoverable — no CapabilityStatement was returned by any
    probed path and no SMART on FHIR configuration is served — so the FHIR release, resource set and
    scope vocabulary are unverified rather than asserted here.
  humanURL: https://fhir.troymedicare.com/
  baseURL: https://fhir.troymedicare.com
  tags:
  - FHIR
  - Authentication
  - Health Data
  - Patient Access
  tags_raw:
  - FHIR
