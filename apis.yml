aid: troy-medicare
name: Troy Medicare
description: >-
  Troy Medicare, operated by Troy Health, Inc. of Charlotte, North Carolina, is a Medicare Advantage
  HMO and HMO D-SNP organization serving Medicare-eligible beneficiaries across 35 North Carolina
  counties under CMS contract H4676. Founded by pharmacists and software engineers, it runs a
  pharmacy-first chronic disease management model that places community pharmacists at the center of
  care coordination, supported by its proprietary Troy.AI technology and by local provider
  partnerships. Troy Medicare publishes no developer program, no API reference and no machine-readable
  API contract; the only machine-readable surfaces it serves anonymously are two OAuth 2.0 / OpenID
  Connect authorization servers — one in front of its secure provider portal and one in front of the
  health plan's FHIR data surface at fhir.troymedicare.com.
