  entirely from the two OpenID Connect discovery documents its own hosts serve anonymously. Both
  are OAuth 2.0 authorization servers: one in front of the secure provider portal, one in front of
  the health plan's FHIR data surface. Neither documents client registration publicly — a
  third-party application developer has no published path to credentials.
